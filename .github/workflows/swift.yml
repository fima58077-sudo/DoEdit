jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install tools
        run: brew install xcodegen ldid
      # дальше всё как было: Generate Xcode project, Build, Package IPA, Upload